name: Security Scan

on:
  push:
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  security-scan:
    name: Universal Security Scanner
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -----------------------------
      # 1. GITLEAKS
      # -----------------------------
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        with:
          args: detect --source . --no-git

      # -----------------------------
      # 2. TRUFFLEHOG
      # -----------------------------
      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          scan: filesystem
          path: "."

      # -----------------------------
      # 3. detect-secrets
      # -----------------------------
      - name: Install detect-secrets
        run: pip install detect-secrets

      - name: Run detect-secrets
        run: |
          detect-secrets scan > .secrets.baseline
          detect-secrets audit .secrets.baseline || exit 1

      # -----------------------------
      # 4. Dependency Scanners (auto)
      # -----------------------------

      # NodeJS
      - name: npm audit (only if package.json exists)
        if: hashFiles('package.json') != ''
        run: |
          npm install --ignore-scripts
          npm audit --audit-level=high

      # Python
      - name: pip-audit (only if requirements.txt exists)
        if: hashFiles('requirements.txt') != ''
        uses: pypa/gh-action-pip-audit@v1.0.8

      # PHP Composer
      - name: Composer audit (only if composer.json exists)
        if: hashFiles('composer.json') != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y composer
          composer install --no-scripts
          composer audit || true

      # Go
      - name: Go vet (only if go.mod exists)
        if: hashFiles('go.mod') != ''
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - name: Go vulnerability check
        if: hashFiles('go.mod') != ''
        run: |
          go mod tidy
          go vet ./...
          go list -json -deps ./... | go vuln check

  # -----------------------------
  # 5. CODEQL (Auto-detect languages)
  # -----------------------------
  codeql:
    permissions:
      contents: read
      security-events: write

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: auto

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Analyze
        uses: github/codeql-action/analyze@v3
