name: Security Scan

on:
  push:
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  ###############################################
  # 1. Detect repository languages dynamically
  ###############################################
  detect-languages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      languages: ${{ steps.detect.outputs.languages }}
      has-languages: ${{ steps.detect.outputs.has-languages }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect languages from GitHub API
        id: detect
        uses: actions/github-script@v7
        with:
          script: |
            const repo = context.repo;
            const res = await github.rest.repos.listLanguages({
              owner: repo.owner,
              repo: repo.repo
            });

            const langMap = res.data;
            const supported = {
              "JavaScript": "javascript",
              "TypeScript": "javascript",
              "Python": "python",
              "Go": "go",
              "Ruby": "ruby",
              "Java": "java",
              "C": "cpp",
              "C++": "cpp",
              "C#": "csharp"
              // Note: PHP is NOT supported by CodeQL
            };

            const detected = Object.keys(langMap)
              .filter(lang => supported[lang])
              .map(lang => supported[lang]);

            // Remove duplicates
            const uniqueLanguages = [...new Set(detected)];

            const languages = JSON.stringify(uniqueLanguages);
            core.setOutput('languages', languages);
            core.setOutput('has-languages', uniqueLanguages.length > 0 ? 'true' : 'false');
            console.log('Detected CodeQL-supported languages:', languages);
            console.log('Has supported languages:', uniqueLanguages.length > 0);

  ###############################################
  # 2. Run GITLEAKS (strong secret scanner)
  ###############################################
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          wget https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz
          tar -xzf gitleaks_8.30.0_linux_x64.tar.gz
          sudo mv gitleaks /usr/local/bin/
          gitleaks version

      - name: Run Gitleaks with baseline
        run: gitleaks detect --source . --verbose --redact --baseline-path gitleaks-baseline.json

  ###############################################
  # 3. Run CodeQL using auto-detected languages
  ###############################################
  codeql:
    needs: [detect-languages]
    if: needs.detect-languages.outputs.has-languages == 'true'
    runs-on: ubuntu-latest

    strategy:
      matrix:
        language: ${{ fromJson(needs.detect-languages.outputs.languages) }}

    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
